name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run regression tests
        run: node --test api/analyze.test.js
